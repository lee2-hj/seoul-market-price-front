<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="100%" height="100%">
  <!-- 1. 심볼 마크: 코믹 핀 (지도 핀 + 배추 + 윙크 & 메롱 + 하락 화살표) -->
  <g transform="translate(10, 10)">
    <!-- 지도 핀 -->
    <path d="M 45,5 
             C 68,5 85,22 85,45 
             C 85,70 53,95 45,100 
             C 37,95 5,70 5,45 
             C 5,22 22,5 45,5 Z" 
          fill="#10B981"/>

    <!-- 핀 상단 작은 잎사귀 -->
    <path d="M 45,5 C 38,-5 52,-8 62,-1 C 62,8 52,5 45,5 Z" fill="#F59E0B"/>

    <!-- 배추 표정 (윙크 & 메롱) -->
    <!-- 윙크 눈 (왼쪽) -->
    <path d="M 28,36 L 36,42 L 28,48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 동그란 눈 (오른쪽) -->
    <circle cx="58" cy="42" r="5" fill="#FFFFFF"/>
    
    <!-- 혀 메롱 입 -->
    <path d="M 36,58 Q 45,68 54,58" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M 41,62 C 41,70 49,70 49,62" fill="#EF4444"/>

    <!-- 가격 하락 포인트 (파란색 미니 화살표) -->
    <path d="M 62,65 L 75,65 L 75,75 L 82,75 L 68,89 L 55,75 L 62,75 Z" fill="#3B82F6"/>
  </g>

  <!-- 2. 워드마크: '싸부' 텍스트 및 서브 타이틀 -->
  <g transform="translate(115, 20)">
    <!-- '싸' 글자 (포인트 레드) -->
    <text x="0" y="62" 
          font-family="'Jua', 'Gmarket Sans', 'Pretendard', sans-serif" 
          font-weight="900" 
          font-size="58" 
          fill="#EF4444" 
          letter-spacing="-1">싸</text>
    
    <!-- '부' 글자 (딥 그린) -->
    <text x="58" y="62" 
          font-family="'Jua', 'Gmarket Sans', 'Pretendard', sans-serif" 
          font-weight="900" 
          font-size="58" 
          fill="#065F46" 
          letter-spacing="-1">부</text>

    <!-- 한 줄 슬로건 -->
    <text x="2" y="86" 
          font-family="'Pretendard', sans-serif" 
          font-weight="700" 
          font-size="13" 
          fill="#059669" 
          letter-spacing="-0.5">싸게 보는 부동산</text>
  </g>
</svg>
