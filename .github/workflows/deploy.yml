name: Deploy Frontend
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./seoul-market-price-front
          push: true
          tags: ghcr.io/lee2-hj/seoul-market-price-front:latest
          build-args: |
            VITE_KAKAO_MAP_JAVASCRIPT_KEY=${{ secrets.VITE_KAKAO_MAP_JAVASCRIPT_KEY }}
            VITE_PORTONE_SDK_SRC=${{ secrets.VITE_PORTONE_SDK_SRC }}
            VITE_PORTONE_STORE_ID=${{ secrets.VITE_PORTONE_STORE_ID }}
            VITE_PORTONE_CHANNEL_KEY=${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u lee2-hj --password-stdin
            cd ~/ssabu
            docker compose pull frontend
            docker compose up -d frontend